<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
       ul{
        display: flex;
        justify-content: center;
        gap: 50px;
        list-style-type: none;
      }
      a{
        text-decoration: none;
        color: red;
       }
       li{
        font-size: 15px;
       transition:text-decoration-line 2s,font-size 2s,transform 2s;
       }
       li:hover{
        font-size: 25px;
       text-decoration-line: underline ;
       /* transform: rotate(30deg); */
     }
     
     nav ul ul{
        display: none;
        border: 2px solid;
         box-shadow:0px 8px 10px 0px rgb(50, 212, 152);
       
        border-radius: 5px 10px 5px 10px;
        position: absolute;
        top: 50px;
         padding: 5px; 
 }
     nav li:hover>ul{
        display: block;
     }
    .la{
        height: 100vh;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTr7Q2-iOUXeta4efD3d8FAPLTOfSN1lKRhOGJInoa6mA&s=10);
        background-repeat: no-repeat;
        background-size: cover;
        transition:transform 2s;
        margin-top: 100px;
    }
    .la:hover{
             transform: rotate(15deg);
    }
    .qa{
        height: 100vh;
        background-color: black;
        opacity: 0.3;
  }
  .wa{
    color: black;
  }
  .w{
    color: red;
    
  }
  .w:hover{
            background-color: aqua;
  }
  .wa:hover:not(.active){
    background-color: brown;
  }

    </style>
</head>

            </ul></li>
        </ul>
    </nav>
