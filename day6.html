<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100vh;
            background-color: rgb(161, 69, 69);
            display: flex;
            justify-content: center;
            align-items:center;
            
        }
        .square{
            height: 100px;
            background-color: rgb(123, 230, 230);
            width: 100px;
            border: 3px solid transparent;
            border-radius: 70%;
            opacity: 0.4;
        }
         input{
            color:rgb(16, 16, 14);
            background-color:rgb(233, 88, 214);
            border-top: none;
            border-left: none;
            border-right: none;
            border-color: rgb(134, 251, 10);

         }
        .img{
            background-image:url(images.jpg);
            background-repeat: no-repeat; 
            background-size: cover; 
            background-attachment: fixed;    
         }
    </style>
</head>
<body>
        <div>
            <div class="square"><h3>logeswaran</h3></div>
        </div><br>
     <div style="display: block; height: 100vh; padding: 30px;">
        <label for="name">Full Name :</label>
        <input type="text" id="name">
        <br><br><br>
         <label for="DOB">Date Of Birth :</label>
        <input type="date" id="DOB">
        <br><br><br>
         <label for="email">Email :</label>
        <input required type="text" id="email" placeholder="loges@gmail.com">
        <br><br><br>
         <label for="mobile number">Mobile Number :</label>
        <input type="tel" id="mobile number" placeholder="+91 00000 00000">
        <br><br><br>
         <label for="address">Address :</label>
        <input type="text" id="address">
        <br><br><br>
         <label for="gender">Gender :</label>
            <select name="gender" id="gd">
                <option value="male">Male</option>
                <option value="female">Female</option>            
                <option value="Others">Others</option>            
            </select>
        <br><br><br>
         <label for="age">Age :</label>
        <input type="number" id="age">
        <br><br><br>
         <label for="photo">Photo :</label>
        <input type="file" id="photo">
        <br><br><br>


        <!-- Radio box -->
            <label for="qulfi">Qulification</label>
            <br><br>
            <input type="radio" name="qulification" value="10 th std">
            <label for="">10 th std</label>
            <br>
             <input type="radio" name="qulification" value="12 th std">
            <label for="">12 th std</label>
            <br>
             <input type="radio" name="qulification" value="Dipolomo">
            <label for="">Dipolomo</label>
            <br>
             <input type="radio" name="qulification" value="" >
            <label for="">BE/Btech</label>
            <br><br>
            <label for="Message">Message</label>
            <br>
            <textarea name="Message" id="Message"></textarea>
            <br><br>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </div>
            <div class="img" style="justify-content: space-evenly;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d15629.353892677549!2d78.0081215!3d11.67040725!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2s!5e0!3m2!1sen!2sin!4v1786421686862!5m2!1sen!2sin" width="500" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>" 
                <iframe width="360" height="360" src="https://www.youtube.com/embed/nHIzb3LQTkg?si=v7f0eF9Xqsgk0WeY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

    
</body>
</html>
