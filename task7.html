<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hi{
            height: 50vh;
            padding: 20px;
            font-size: larger;
            }
        .ho{
            width: 70%;
            height: 6vh;
        }
        .ab{
            width: 100px;
            height: 100px;
        }
        .le{
            display: flex;
            justify-content: center;
        }
        .lw{
            border: 1px solid #ddd;
            width: 360px;
            padding: 20px;
        }
        .mm{
            border:1px solid #ddd;
            height: 350px;
            width: 400px;
        }
        
        
        
        
    </style>
</head>
<body>
    <div>
        <center class="hi">
            <div class="mm">  
                <legend >
                    <img class="ab" src="images.png" alt="">
                </legend>
                <label for="phone number,username,oremail"></label>
                <input required class="ho" type="text" id="phone number,username,oremail" placeholder="phone number,username,oremail">
                    <br><br>
                <label for="password"></label>
                <input required class="ho" id="password" type="password" placeholder="password">
                    <br><br>
                <button class="ho" type="submit" style="background-color: rgb(8, 171, 236);">
                Log in
                </button>
                    <br><br>
                <a href="" style="text-decoration: none;" target="_blank">Forgot password?</a>
            </div>
            <br><br>
            <div class="lw">
                Don't have an account
                 <a style="text-decoration: none;" href="" target="_blank">Sign up</a>
            </div>
            <p>
                Get the app.
            </p>
            <div class="le">
                    <img src="download.png" alt="" style="width: 100px;"> 
                    <img src="download (1).png" alt="" style="width: 80px;">
                    <img src="images (1).png" alt="" style="height: 30px; width: 100px; padding-top: 31px;">
            </div>
           

        </center>
        

    </div>
    
</body>
</html>
